<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Primary -->
    <title>Financial Advisor Website Design &amp; Copywriting | Capital Design Studio</title>
    <meta
      name="description"
      content="Strategic website design and copywriting for financial advisors and wealth management firms. Clarify your positioning and create a website that earns enquiries."
    />
    <link rel="canonical" href="%SITE_URL%/" />
    <meta name="robots" content="index, follow, max-image-preview:large" />
    <meta name="author" content="Capital Design Studio" />
    <meta name="theme-color" content="#0b4cf4" />

    <!-- Icons: blue square with the white mark -->
    <link rel="icon" href="/favicon.ico" sizes="48x48" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />

    <!-- Open Graph (LinkedIn, Facebook, iMessage, Slack) -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Capital Design Studio" />
    <meta property="og:locale" content="en_US" />
    <meta property="og:url" content="%SITE_URL%/" />
    <meta
      property="og:title"
      content="Financial Advisor Website Design &amp; Copywriting | Capital Design Studio"
    />
    <meta
      property="og:description"
      content="Strategic website design and copywriting for financial advisors and wealth management firms. Clarify your positioning and create a website that earns enquiries."
    />
    <meta property="og:image" content="%SITE_URL%/og-image.png" />
    <meta property="og:image:secure_url" content="%SITE_URL%/og-image.png" />
    <meta property="og:image:type" content="image/png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta
      property="og:image:alt"
      content="Capital Design Studio: Your advice is excellent. Your website should say so."
    />

    <!-- X / Twitter -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta
      name="twitter:title"
      content="Financial Advisor Website Design &amp; Copywriting | Capital Design Studio"
    />
    <meta
      name="twitter:description"
      content="Strategic website design and copywriting for financial advisors and wealth management firms. Clarify your positioning and create a website that earns enquiries."
    />
    <meta name="twitter:image" content="%SITE_URL%/og-image.png" />
    <meta
      name="twitter:image:alt"
      content="Capital Design Studio: Your advice is excellent. Your website should say so."
    />

    <!-- Structured data: who we are, for search results -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@graph": [
          {
            "@type": "ProfessionalService",
            "@id": "%SITE_URL%/#studio",
            "name": "Capital Design Studio",
            "url": "%SITE_URL%/",
            "logo": "%SITE_URL%/icon-512.png",
            "image": "%SITE_URL%/og-image.png",
            "description": "Positioning, copywriting and web design studio for financial advisors.",
            "founder": { "@type": "Person", "name": "Chaitra Rao" },
            "email": "hello@chaitrarao.com",
            "sameAs": ["https://www.linkedin.com/company/capitaldesignstudio/"],
            "knowsAbout": [
              "Positioning",
              "Copywriting",
              "Web design",
              "Websites for financial advisors",
              "Web accessibility"
            ],
            "serviceType": "Website design for financial advisors"
          },
          {
            "@type": "WebSite",
            "@id": "%SITE_URL%/#website",
            "url": "%SITE_URL%/",
            "name": "Capital Design Studio",
            "publisher": { "@id": "%SITE_URL%/#studio" },
            "inLanguage": "en"
          }
        ]
      }
    </script>

    <link rel="preload" href="/fonts/sohne-400.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/fonts/signifier-300.woff2" as="font" type="font/woff2" crossorigin />
    <link
      rel="preload"
      href="/fonts/signifier-300-italic.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <link rel="preload" href="/fonts/sohne-500.woff2" as="font" type="font/woff2" crossorigin />
  </head>
  <body>
    <noscript>
      Capital Design Studio: positioning, copywriting and web design for financial advisors. Please
      enable JavaScript to view this site.
    </noscript>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
