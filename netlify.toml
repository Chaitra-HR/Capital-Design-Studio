# Netlify: build the Vite site and serve it as a one-page app
[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"
  # Used for canonical links, social previews, sitemap.xml and robots.txt
  VITE_SITE_URL = "https://capitaldesign.studio"

# Any unknown path loads the app, which shows its own "page not found"
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Hashed build files never change, so browsers can keep them for a year
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/fonts/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Images keep their names when replaced, so cache them for a month
[[headers]]
  for = "/images/*"
  [headers.values]
    Cache-Control = "public, max-age=2592000"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
